# CURE v1 / Latent-CE 配置；${...} 表示引用本文件中的其他参数。
# 数据域及文件位置；${...} 会引用本配置中的其他参数。
data:
  # 数据域；同时决定处理数据、checkpoint 和结果目录。
  domain: beauty
  # 处理后的用户序列与 valid/test CSV 所在目录。
  processed_dir: data/processed/${data.domain}_2018_2023
  # RQ-VAE 产物目录，包含商品 SID 映射。
  artifact_dir: data/artifacts/${data.domain}_2018_2023
  # 训练历史；训练样本由这里的用户序列展开。
  user_sequences_path: ${data.processed_dir}/user_sequences.json
  # 训练验证目标；评估 test 时还会把 valid 商品接到历史末尾。
  valid_path: ${data.processed_dir}/valid.csv
  # 评估目标，采用 train + valid -> test 协议。
  test_path: ${data.processed_dir}/test.csv
  # item_id 到三层 SID token 的映射文件。
  item_index_path: ${data.artifact_dir}/item.index.json

# 模型初始化与 latent reasoner 结构。
model:
  # 冻结的 merged SFT 模型和 tokenizer；CURE 的 best/ 只存新增权重。
  sft_model_path: data/checkpoints/${data.domain}/sft/merged
  # K=1：历史表示 [B,N,H] 经单 query attention 得到 z [B,H]。
  reasoner:
    # latent query 数；v1 固定为 1，其他值会报错。
    num_latents: 1
    # reasoner 内部维度 D，不是 Qwen 的 hidden_size H。
    hidden_dim: 256
    # cross-attention 头数，必须能整除 hidden_dim。
    num_heads: 4
    # cross-attention 层数；v1 固定为 1。
    num_layers: 1
    # 新近位置 embedding 容量；建议与 train.max_history_len 一致。
    max_history_len: 20
    # reasoner 的 dropout 比例；仅训练模式生效。
    dropout: 0.1

# Phase 1 仅启用推荐交叉熵；CURE-U/UA 尚未实现。
method:
  # 当前唯一可运行的变体；更换为 CURE-U/UA 会报错。
  variant: latent_ce
  # utilization loss 权重；Phase 1 必须为 0。
  lambda_util: 0.0
  # anchor loss 权重；Phase 1 必须为 0。
  lambda_anchor: 0.0

# 训练参数；其中 max_history_len 和 seed 也用于评估。
train:
  # 完整遍历训练样本的次数。
  epochs: 3
  # 每张 GPU 每次前向的样本数；增大会提高显存峰值。
  per_device_batch_size: 16
  # 累积多少次前向再更新参数；有效 batch 约等于每卡 batch × GPU 数 × 累积步数。
  gradient_accumulation_steps: 4
  # 只用于 reasoner、latent projection 和 fusion gate 的学习率。
  learning_rate: 1.0e-4
  # 新增可训练参数的 AdamW 权重衰减。
  weight_decay: 0.01
  # 总优化步数中用于学习率预热的比例。
  warmup_ratio: 0.03
  # 每条样本最多保留最近多少个历史商品；评估也使用此值。
  max_history_len: 20
  # 训练 token 序列上限；过小会截断历史位置。
  max_seq_len: 512
  # 商品重建辅助样本的目标占比；实际数量受商品总数限制。
  aux_ratio: 0.1
  # 训练样本混合与评估抽样使用的随机种子。
  seed: 42
  # wandb 项目名；设为 null 可关闭 wandb。
  wandb_project: genrec
  # wandb 中显示的运行名称。
  wandb_run_name: cure_${data.domain}_latent_ce_v1
  # 每隔多少次参数更新记录一次 step loss 和学习率。
  wandb_log_steps: 10
  # best/ 用于评估；best_ckpt/ 保存可恢复的训练状态。
  output_dir: data/checkpoints/${data.domain}/cure

# 以下 Accelerate/DeepSpeed 设置只用于训练。
distributed:
  # Accelerate 混合精度；与下方 DeepSpeed bf16.enabled 对应。
  mixed_precision: bf16
  # 训练时使用的 DeepSpeed ZeRO-2 配置。
  deepspeed:
    # auto 根据每卡 batch、累积步数和 GPU 数计算全局 batch。
    train_batch_size: auto
    # 每卡一次前向的样本数，引用 train.per_device_batch_size。
    train_micro_batch_size_per_gpu: ${train.per_device_batch_size}
    # 与训练器的梯度累积步数保持一致。
    gradient_accumulation_steps: ${train.gradient_accumulation_steps}
    # 参数更新前的梯度裁剪阈值。
    gradient_clipping: 1.0
    # DeepSpeed 内的 bf16 选项。
    bf16:
      # 启用 bf16；与 distributed.mixed_precision 一致。
      enabled: true
    # ZeRO 的分片和通信选项。
    zero_optimization:
      # ZeRO-2 分片优化器状态与梯度；各卡仍持有模型参数。
      stage: 2
      # 把梯度放入连续缓冲区，减少显存碎片。
      contiguous_gradients: true
      # 尽量让梯度通信与计算重叠。
      overlap_comm: true
      # 使用 reduce-scatter 汇总梯度。
      reduce_scatter: true
      # 梯度归约的通信 bucket 大小；调大可能提高瞬时显存。
      reduce_bucket_size: 200000000
      # 参数 all-gather 的通信 bucket 大小；调大可能提高瞬时显存。
      allgather_bucket_size: 200000000
      # 优化器状态卸载设置。
      offload_optimizer:
        # none 表示不卸载到 CPU/NVMe。
        device: none
      # 模型参数卸载设置。
      offload_param:
        # none 表示不卸载到 CPU/NVMe。
        device: none

# 评估沿用 SFT 的 train + valid -> test 历史和 SID 约束解码。
eval:
  # 加载 train.output_dir/best，不是用于恢复训练的 best_ckpt。
  model_path: ${train.output_dir}/best
  # 固定随机抽取的 test 样本数；null 表示评估全部样本。
  sample_size: 5000
  # 每个样本生成并返回的候选 SID 数；越大越耗显存和时间。
  num_beams: 50
  # 每张 GPU 一次评估的样本数；峰值大致随 batch_size × num_beams 增长。
  batch_size: 8
  # 计算哪些 HR@K/NDCG@K；不会为每个 K 重新生成。
  k_values: [1, 3, 5, 10, 20, 50]
  # 结果 JSON 路径；改 sample_size 时建议同时更改文件名。
  output_path: data/eval_results/${data.domain}/cure_latent_ce_5k.json
  # normal 使用 latent；zero 关闭 latent fusion，用于对照。
  latent_mode: normal

# 控制 Hydra 启动时的工作目录和输出目录。
hydra:
  # null 表示不另存 .hydra 配置副本。
  output_subdir: null
  # Hydra 运行目录设置。
  run:
    # 保持启动时的工作目录为 .；请从项目根目录启动脚本。
    dir: .
  # Hydra 进程工作目录设置。
  job:
    # false 表示不切换到 Hydra 创建的运行目录。
    chdir: false

# 训练与评估分别记录；多进程时仅全局主进程写本地文件。
logging:
  # 训练数据、step/epoch loss 和 checkpoint 保存记录。
  train_output_path: logs/cure_${data.domain}_train.log
  # 评估进度、HR/NDCG 与结果文件路径。
  eval_output_path: logs/cure_${data.domain}_eval.log
  # 兼容旧命令：非 null 时覆盖当前入口对应的日志路径。
  output_path: null
  # 日志级别，例如 INFO 或 DEBUG。
  level: INFO
  # a 为追加，重跑不会清空先前日志；设为 w 可在启动时覆盖。
  mode: a
