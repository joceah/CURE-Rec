# SFT 训练配置 - Sports 数据集
epochs: 3
per_device_batch_size: 64
gradient_accumulation_steps: 4
learning_rate: 2e-4
weight_decay: 0.01
warmup_ratio: 0.03
max_history_len: 20
max_seq_len: 512
aux_ratio: 0.1
seed: 42

# wandb
wandb_project: genrec
wandb_run_name: sft_sports_v1
wandb_log_steps: 10

# 输出
output_dir: data/checkpoints/sft_sports
tokenizer_save_dir: data/checkpoints/sft_sports/tokenizer
