# 阶段 3：使用 Qwen + LoRA 训练生成式推荐模型
data:
  domain: beauty
  processed_dir: data/processed/${data.domain}_2018_2023
  artifact_dir: data/artifacts/${data.domain}_2018_2023
  user_sequences_path: ${data.processed_dir}/user_sequences.json
  train_path: ${data.processed_dir}/train.csv
  valid_path: ${data.processed_dir}/valid.csv
  test_path: ${data.processed_dir}/test.csv
  item_index_path: ${data.artifact_dir}/item.index.json

model:
  llm:
    base_model: Qwen/Qwen2.5-1.5B
    # 当前机器已有该模型缓存；设为 true 时只读本地缓存，不访问 Hugging Face Hub。
    local_files_only: true
    sft_model_path: null
    tokenizer_path: null
    rqvae:
      num_layers: 3
      codebook_size: 512
    lora:
      r: 16
      alpha: 32
      dropout: 0.05
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - gate_proj
        - up_proj
        - down_proj

train:
  epochs: 3
  max_steps: null # optimizer update 上限；null 按 epochs 训练。
  # 以下步数均指 optimizer update，不是 microbatch；epoch 结束也会补一次验证。
  eval_steps: 500 # null 仅在 epoch 结束验证；与 wandb_log_steps 无关。
  early_stop:
    enabled: true
    monitor: loss # CURE 看 correct branch，SFT 看 validation loss。
    mode: min
    patience_steps: 2500 # 距上次显著提升的 optimizer update 数；在验证时判断。
    min_delta: 0.0001    # 超过此绝对差值才重置 patience；不限制 best checkpoint 保存。
  per_device_batch_size: 32 # 每张卡一次 forward 的样本数；和 CURE 同名。
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_history_len: 20
  max_seq_len: 512
  aux_ratio: 0.1
  seed: 42
  wandb_enabled: true
  wandb_mode: online
  wandb_project: genrec
  wandb_run_name: sft_${data.domain}_v1
  wandb_log_steps: 10 # 每多少次 optimizer update 记录训练指标；和 CURE 同名。
  output_dir: data/checkpoints/${data.domain}/sft
  tokenizer_save_dir: ${train.output_dir}/tokenizer

# 固定 validation 子集用于 step 验证和早停，避免频繁跑全量数据。
eval:
  sample_size: 1000 # null 使用全部 validation。
  batch_size: ${train.per_device_batch_size}
  random_seed: ${train.seed}

distributed:
  mixed_precision: bf16
  deepspeed:
    train_batch_size: auto
    train_micro_batch_size_per_gpu: ${train.per_device_batch_size}
    gradient_accumulation_steps: ${train.gradient_accumulation_steps}
    gradient_clipping: 1.0
    bf16:
      enabled: true
    zero_optimization:
      stage: 2
      contiguous_gradients: true
      overlap_comm: true
      reduce_scatter: true
      reduce_bucket_size: 200000000
      allgather_bucket_size: 200000000
      offload_optimizer:
        device: none
      offload_param:
        device: none

hydra:
  output_subdir: null
  run:
    dir: .
  job:
    chdir: false

logging:
  output_path: logs/sft_${data.domain}.log
  level: INFO
  mode: w
